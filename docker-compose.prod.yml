services:
  nginx:
    image: nginx:alpine
    ports:
      - "${PORT:-4105}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=https://expo-map.runhatch.com
    restart: unless-stopped

  backend:
    build: ./backend
    expose:
      - "8000"
    environment:
      - DATA_DIR=/app/data
    volumes:
      - /Users/endofsky/Documents/aidev/expo-map/docker-data-prod/data:/app/data
      - /Users/endofsky/Documents/aidev/expo-map/docker-data-prod/uploads:/app/uploads
    restart: unless-stopped
